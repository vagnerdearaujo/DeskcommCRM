# Stack local de dependências externas para o DeskcommCRM.
#
# Sobe apenas o WAHA (Plus / NOWEB) pra desenvolvimento. Postgres + Auth + Storage
# vêm do Supabase Cloud (ou supabase local CLI separadamente, conforme o time preferir).
#
# Uso:
#   1. Copie .env.example -> .env.local e preencha WAHA_API_KEY (plaintext)
#   2. docker compose up -d
#   3. Acesse http://localhost:3030/dashboard/ (UI do WAHA)
#      (host port 3030 — :3000 fica reservado pra outros dev tools como Remotion)
#
# Auth WAHA (DEV, build noweb): o container compara o header X-Api-Key DIRETAMENTE
# contra WAHA_API_KEY (plaintext). NÃO use hash SHA512 aqui — isso é do build WAHA
# Plus. O .env.local mantém WAHA_API_KEY_SHA512 só por legado; o override limpa
# essa var no container. Se trocar o image para waha-plus, aí sim use o hash.
#
# Em prod, WAHA roda em VPS dedicada (Hostgator) atrás de Nginx (proxy_buffering off
# pra SSE). docker-compose aqui é DEV ONLY.

version: "3.9"

services:
  waha:
    image: devlikeapro/waha:noweb
    platform: linux/amd64
    container_name: deskcomm-waha
    restart: unless-stopped
    ports:
      - "3030:3000"
    environment:
      # Build noweb: compara o header X-Api-Key DIRETAMENTE contra WAHA_API_KEY
      # (plaintext). NÃO é hash. O override limpa WAHA_API_KEY_SHA512.
      WAHA_API_KEY: ${WAHA_API_KEY}
      # Webhook base URL — precisa ser pública (use ngrok/cloudflared em dev).
      # host.docker.internal: o app Next roda no HOST em dev — localhost dentro do
      # container seria o próprio WAHA e o webhook nunca chegaria. Porta 3002:
      # a stack da fusão é isolada do checkout principal (3001 é do gov-loop).
      WHATSAPP_HOOK_URL: ${WAHA_HOOK_BASE_URL:-http://host.docker.internal:3003}/api/v1/webhooks/waha
      WHATSAPP_HOOK_EVENTS: "message.any,message.ack,message.edited,message.revoked,session.status,state.change"
      # HMAC SHA512 do payload, validado server-side via crypto.timingSafeEqual.
      WHATSAPP_HOOK_HMAC: ${WAHA_HMAC_SECRET}
      # Engine NOWEB por default (mais leve, ~150MB; estável). O env é
      # WHATSAPP_DEFAULT_ENGINE — WAHA_DEFAULT_ENGINE NÃO existe no WAHA e caía
      # silenciosamente no default WEBJS (browser, trava a sessão).
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      # Storage de mídia: Supabase Storage via Backend (NÃO inline base64).
      WAHA_DASHBOARD_ENABLED: "true"
      # Sem isto o container volta (ou o Docker Desktop acorda) e as sessões
      # ficam STOPPED — o front abre em "Conectando…" e as mensagens do período
      # fora não chegam. True retoma as que já existiam; não pede QR de novo.
      WHATSAPP_RESTART_ALL_SESSIONS: "${WHATSAPP_RESTART_ALL_SESSIONS:-True}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Bind mounts no disco físico — dados sobrevivem a docker compose down.
      # Política 2026-08-05: o dev NUNCA conecta o número real. A pasta de
      # sessões do dev é SEPARADA (sessions-dev); ./data/waha/sessions (com
      # possíveis sessões reais) fica reservada ao prod local/VPS — o WAHA dev
      # não a enxerga nem auto-conecta nada. Testar mensagens via webhook
      # simulado (docs/runbooks/waha-local.md §9).
      - type: bind
        source: ./data/waha/sessions-dev
        target: /app/.sessions
      - type: bind
        source: ./data/waha/media
        target: /app/.media
    healthcheck:
      # /ping é o único endpoint sem auth desta build (api/health = 401/404).
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Worker 24/7 do agent-engine (fusão Vendaval): fila, cron/follow-up, drain do
  # event_log e turnos do agente rico. Postgres = Supabase (SUPABASE_DB_URL no
  # .env.local). Sobe junto do WAHA: `docker compose up -d`.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: deskcomm-agent-worker
    restart: unless-stopped
    env_file:
      - .env
      - .env.local
    environment:
      # dentro do container, localhost é o próprio worker — o WAHA está na rede
      # do compose (serviço waha, porta interna 3000). Sobrepõe o .env.local.
      WAHA_API_BASE_URL: http://waha:3000
    ports:
      - "8787:8787"
    healthcheck:
      # 127.0.0.1 explícito: localhost resolve p/ ::1 e o healthz escuta só IPv4.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

# Volumes nomeados substituídos por bind mounts (./data/...) para persistência no
# disco físico. Os diretórios são criados automaticamente pelo Docker Engine
# quando o container inicia, mas dados pré-existentes devem ser migrados (ver
# docs/operations/backup-restore.md ou scripts/migrate-volumes-to-bind.sh).
# volumes:
#   waha-data:
#   waha-media:
