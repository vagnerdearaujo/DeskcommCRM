# Local dev override: credenciais WAHA persistentes + Redis + serverless-redis-http.
# Mescla automaticamente com docker-compose.yml (Docker Compose V2).
# Uso: docker compose up -d

services:
  waha:
    environment:
      # WAHA CORE aceita API key como plaintext (NÃO sha512 — isso é do PLUS)
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
      WHATSAPP_SWAGGER_USERNAME: ${WHATSAPP_SWAGGER_USERNAME:-admin}
      WHATSAPP_SWAGGER_PASSWORD: ${WHATSAPP_SWAGGER_PASSWORD}
      WAHA_API_KEY_SHA512: ""  # limpa o hash (CORE ignora, mas explicito)

  worker:
    environment:
      # Dentro do container, 127.0.0.1 é ele mesmo — precisa do host para Postgres
      SUPABASE_DB_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres

  redis:
    image: redis:7-alpine
    container_name: deskcomm-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - type: bind
        source: ./data/redis
        target: /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3

  srh:
    image: hiett/serverless-redis-http:latest
    container_name: deskcomm-srh
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${SRH_TOKEN}
      SRH_CONNECTION_STRING: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy
